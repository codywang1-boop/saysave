<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d4aff">
<title>SaySave</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<div class="app">

    <svg class="logo" viewBox="0 0 140 140" aria-hidden="true"><defs>

<linearGradient id="lg-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#C2410C"/></linearGradient>
<linearGradient id="lg-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="lg-shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs><rect width="140" height="140" rx="32" fill="url(#lg-bg)"/><path d="M0 32 a32 32 0 0 1 32 -32 h76 a32 32 0 0 1 32 32 v8 c-40 -16 -100 -16 -140 0z" fill="url(#lg-shine)"/><g transform="translate(0.0 0.0) scale(1.0)"><ellipse cx="70" cy="123" rx="50" ry="7" fill="url(#lg-shadow)"/>
<path d="M28 42 h28 l9 10 h43 a8 8 0 0 1 8 8 v50 a8 8 0 0 1 -8 8 h-80 a8 8 0 0 1 -8 -8 v-60 a8 8 0 0 1 8 -8z" fill="url(#lg-back)"/>
<path d="M20 68 h100 v42 a8 8 0 0 1 -8 8 h-84 a8 8 0 0 1 -8 -8z" fill="url(#lg-front)"/>
<rect x="20" y="68" width="100" height="4" fill="#FFFFFF" opacity=".55"/>
<rect x="63" y="77" width="14" height="23" rx="7" fill="#FFFFFF"/>
<path d="M57 93 a13 13 0 0 0 26 0 M70 106 v5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/></g></svg>
    <div>
      <div class="brand-name">SaySave</div>
      <div class="brand-sub">Say it. It's filed.</div>
    </div>
    <button class="mode-pill" id="modePill" type="button">Demo Drive</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar"><div class="inner">
  <button class="tab on" data-tab="home" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Save</button>
  <button class="tab" data-tab="commands" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>Commands</button>
  <button class="tab" data-tab="organize" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8M12 10v6"/></svg>Organize</button>
  <button class="tab" data-tab="setup" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>

<input type="file" id="filePick" multiple class="hidden">
<input type="file" id="camPick" accept="image/*" capture="environment" class="hidden">
<div id="layer"></div>

<script src="logic.js"></script>
<script src="drive.js"></script>
<script src="scan.js"></script>
<script src="app.js"></script>
</body>
</html>
