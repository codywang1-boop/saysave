<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b3fd8">
<title>SaySave</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5ff0"/><stop offset="1" stop-color="#2c30b8"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#lg)"/>
      <path d="M14 24a5 5 0 0 1 5-5h9l4 4h13a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5z" fill="#fff" opacity=".95"/>
      <rect x="28" y="27" width="8" height="12" rx="4" fill="#3b3fd8"/>
      <path d="M24.5 35a7.5 7.5 0 0 0 15 0" stroke="#3b3fd8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M32 42.5v2.5" stroke="#3b3fd8" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-name">SaySave</div>
      <div class="brand-sub">Say it. It's filed.</div>
    </div>
    <button class="mode-pill" id="modePill" type="button">Demo Drive</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar"><div class="inner">
  <button class="tab on" data-tab="home" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Save</button>
  <button class="tab" data-tab="commands" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg>Commands</button>
  <button class="tab" data-tab="organize" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8M12 10v6"/></svg>Organize</button>
  <button class="tab" data-tab="setup" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>

<input type="file" id="filePick" multiple class="hidden">
<div id="layer"></div>

<script src="logic.js"></script>
<script src="drive.js"></script>
<script src="app.js"></script>
</body>
</html>
